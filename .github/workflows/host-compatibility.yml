name: Host compatibility
on:
  push:
    branches: [main, 'codex/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          architecture: x64
      - name: Install dependencies
        run: python -m pip install -r host/requirements.txt
      - name: Run tests without hardware
        run: python -m unittest discover -s host -p "test_*.py" -q
      - name: Verify console CLI
        run: python host/console.py --help
      - name: Verify Windows setup and launcher in a path with spaces
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'UWR test folder'
          New-Item -ItemType Directory -Force $target | Out-Null
          Copy-Item host, setup-windows.cmd, run-console.cmd, show-input.cmd -Destination $target -Recurse
          Push-Location $target
          try {
            cmd /c 'setup-windows.cmd --no-pause'
            if ($LASTEXITCODE -ne 0) { throw 'Windows setup failed' }
            cmd /c 'run-console.cmd --help'
            if ($LASTEXITCODE -ne 0) { throw 'Windows launcher failed' }
          } finally { Pop-Location }
