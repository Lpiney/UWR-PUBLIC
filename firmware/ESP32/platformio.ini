; ============================================================================
;  CityUHK UR Fall Training 2026 - ROV main controller firmware
;
;  Board: ESP32-S3 N8R8 (8 MB flash + 8 MB octal PSRAM).
;  This is the only MCU on the ROV. It does three things:
;    1) Bidirectional ASCII line protocol with the surface laptop over USB
;    2) Two 50 Hz PWM channels driving the ESCs
;    3) Wi-Fi + HTTP fetch for Mission 1, performed by the board itself
; ============================================================================

[env:uwr-rov]
platform = espressif32@7.1.3
board = esp32-s3-devkitc-1
framework = arduino

; Both N8R8 and N16R8 use octal PSRAM with the flash in QIO mode.
board_build.arduino.memory_type = qio_opi

; The lab board (competition) is N8R8 = 8 MB flash. The partition table must
; match, otherwise partitions get placed past the end of flash and the image is
; silently broken.
;
; 8 MB is the safe default: it also runs on a 16 MB board (N16R8), which just
; uses the lower half. The reverse is NOT true - a 16 MB table on an 8 MB chip
; produces an image that will not boot. To use the full flash on N16R8, build
; the 16 MB environment with  -e uwr-rov-16mb .
board_build.flash_size = 8MB
board_build.partitions = default_8MB.csv

monitor_speed = 115200
; The lab board's WCH USB-UART bridge throws errors while reading flash at high
; speed, so the first flash uses a conservative rate.
upload_speed = 115200
monitor_filters = esp32_exception_decoder, time

build_flags =
	-DBOARD_HAS_PSRAM
	; These two lines are the foundation of the whole comms design:
	;   USB_MODE=1      -> use the on-chip USB-Serial-JTAG peripheral (HWCDC)
	;   CDC_ON_BOOT=1   -> point Serial at the native USB port (the one labelled
	;                      "USB"), not at UART0 (labelled "COM")
	; Result: the laptop sees /dev/cu.usbmodem*, which is our control link.
	; Serial0 stays on UART0, so plugging into "COM" shows the same debug log.
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_LOOP_STACK_SIZE=32768

; ---------------------------------------------------------------------------
;  Same firmware for a 16 MB board (e.g. ESP32-S3-N16R8).
;
;  Build and flash with:   pio run -e uwr-rov-16mb -t upload
;
;  Everything else is inherited. Only the flash layout differs, so it is worth
;  checking which chip is actually on the desk before picking an environment.
; ---------------------------------------------------------------------------
[env:uwr-rov-16mb]
extends = env:uwr-rov
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
